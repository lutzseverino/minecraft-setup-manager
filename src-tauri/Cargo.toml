[package]
name = "maresme-mc-setup"
version = "0.1.0"
description = "Desktop setup wizard for Maresme MC clients"
authors = ["Maresme MC"]
edition = "2021"

[lib]
name = "maresme_mc_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
