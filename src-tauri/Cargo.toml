[package]
name = "minecraft-setup-manager"
version = "0.1.0"
description = "Desktop setup manager for Minecraft client setups"
authors = ["Minecraft Setup Manager contributors"]
edition = "2021"

[lib]
name = "minecraft_setup_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
