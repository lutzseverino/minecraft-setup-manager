[package]
name = "minecraft-setup-manager"
version = "0.1.3"
description = "Desktop setup manager for Minecraft client setups"
authors = ["Minecraft Setup Manager contributors"]
edition = "2021"

[features]
validation-tools = []

[lib]
name = "minecraft_setup_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sklauncher-contract-probe"
path = "src/bin/sklauncher_contract_probe.rs"
required-features = ["validation-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fastnbt = "2.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
unicode-normalization = "0.1"
